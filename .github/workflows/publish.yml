name: Publish GitHub Release Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build Linux x64 package and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          version="$(node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');

          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tags = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' }).split(/\r?\n/);
          const versions = [packageVersion, ...tags]
            .map((value) => /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value.trim()))
            .filter(Boolean)
            .map((match) => match.slice(1).map(Number))
            .sort((left, right) =>
              right[0] - left[0] || right[1] - left[1] || right[2] - left[2],
            );

          const [major, minor, patch] = versions[0];
          process.stdout.write(`${major}.${minor}.${patch + 1}`);
          NODE
          )"
          npm version "$version" --no-git-tag-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pnpm run build

      - name: Create prebuilt npm package
        shell: bash
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          package_file="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package_file"
          mv "$package_file" release/difit-linux-x64.tgz
          tar -tzf release/difit-linux-x64.tgz > release/package-contents.txt
          grep -qx 'package/dist/cli/index.js' release/package-contents.txt
          grep -qx 'package/dist/client/index.html' release/package-contents.txt
          sha256sum release/difit-linux-x64.tgz > release/difit-linux-x64.tgz.sha256

      - name: Test packaged CLI on Linux x64
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          actual_version="$(npm exec --yes --package="$PWD/release/difit-linux-x64.tgz" -- difit --version)"
          test "$actual_version" = "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release/difit-linux-x64.tgz \
            release/difit-linux-x64.tgz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Difit ${{ steps.version.outputs.version }}" \
            --generate-notes
